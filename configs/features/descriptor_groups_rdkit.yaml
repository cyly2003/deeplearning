descriptor_source: rdkit
standardization:
  method: robust_zscore
  missing_strategy: train_median_with_mask
groups:
  hydrophobicity_partition:
    description: Hydrophobicity and partition-related descriptors.
    initial_group_weight: 1.0
    bias_init: 0.0
    descriptors:
      rdkit_descriptor_mol_logp:
        role: core
        initial_weight: 1.0
  polarity_hbond:
    description: Polarity, hydrogen bonding and polar surface descriptors.
    initial_group_weight: 1.0
    bias_init: 0.0
    descriptors:
      rdkit_descriptor_tpsa:
        role: core
        initial_weight: 1.0
      rdkit_descriptor_h_bond_donors:
        role: core
        initial_weight: 1.0
      rdkit_descriptor_h_bond_acceptors:
        role: core
        initial_weight: 1.0
  electronic_reactivity:
    description: Formal-charge proxy for electronic reactivity and ionization.
    initial_group_weight: 1.0
    bias_init: 0.0
    descriptors:
      rdkit_descriptor_formal_charge:
        role: core
        initial_weight: 1.0
  topology_connectivity:
    description: Compact graph topology descriptors.
    initial_group_weight: 1.0
    bias_init: 0.0
    descriptors:
      rdkit_descriptor_ring_count:
        role: core
        initial_weight: 1.0
  size_shape:
    description: Molecular size, atom-count and mass descriptors.
    initial_group_weight: 1.0
    bias_init: 0.0
    descriptors:
      rdkit_descriptor_mol_wt:
        role: core
        initial_weight: 1.0
      rdkit_descriptor_exact_mol_wt:
        role: auxiliary
        initial_weight: 0.5
      rdkit_descriptor_heavy_atom_count:
        role: core
        initial_weight: 1.0
  flexibility_saturation:
    description: Conformational flexibility and saturation descriptors.
    initial_group_weight: 1.0
    bias_init: 0.0
    descriptors:
      rdkit_descriptor_rotatable_bonds:
        role: core
        initial_weight: 1.0
      rdkit_descriptor_fraction_csp3:
        role: core
        initial_weight: 1.0
