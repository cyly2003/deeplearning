experiment:
  id: baseline_deep_v001
  seed: 20260524
  output_dir: outputs/models/${experiment.id}
includes:
  data: configs/data/ecotox_clean_sqlite.yaml
  chemical_features: configs/features/chemical_rdkit_morgan.yaml
  species_features: configs/features/species_context.yaml
  descriptor_groups: configs/features/descriptor_groups_rdkit.yaml
  rules: configs/rules/mechanistic_rules.yaml
  evaluation: configs/evaluation/chemical_category_holdout.yaml
  runtime: configs/runtime/local.yaml
model:
  name: baseline_deep_residual_qsar
  architecture: residual_qsar_mlp
  target_column: target_ptox
  chemical_encoder:
    use_descriptor_grouping: true
    use_morgan_fingerprint: true
    hidden_dims: [256, 128]
    embedding_dim: 128
    dropout: 0.1
  head_hidden_dims: [128, 64]
  context_encoder:
    use_species: false
    use_duration: false
    use_endpoint: false
    hidden_dims: [64]
    species_embedding_dim: 32
    time_embedding_dim: 16
  rule_encoder:
    enabled: false
  residual:
    alpha_init: 0.2
    beta_init: 0.1
    context_l2: 0.01
    rule_l2: 0.01
training:
  smoke_helper: qsar_dl.training.train_deep.run_small_train_smoke
  # Full-data ablations should run on all main-water-task records by default.
  # Use CLI --max-rows only for smoke tests.
  max_rows: null
  batch_size: 1024
  max_epochs: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 3
  device: auto
deep_features:
  descriptor_columns:
    - rdkit_descriptor_mol_wt
    - rdkit_descriptor_exact_mol_wt
    - rdkit_descriptor_mol_logp
    - rdkit_descriptor_tpsa
    - rdkit_descriptor_h_bond_donors
    - rdkit_descriptor_h_bond_acceptors
    - rdkit_descriptor_rotatable_bonds
    - rdkit_descriptor_ring_count
    - rdkit_descriptor_heavy_atom_count
    - rdkit_descriptor_fraction_csp3
    - rdkit_descriptor_formal_charge
    - molecular_weight_g_mol
    - logkow
    - molecular_weight_g_mol_missing_flag
    - logkow_missing_flag
  fingerprint_prefix: morgan_fp_
  species_context_columns: []
ablation_suite:
  - id: chemical_only
    label: Chemical only
    description: Chemical structure branch only; no endpoint, duration, species, or rule residual.
    model:
      context_encoder:
        use_endpoint: false
        use_duration: false
    deep_features:
      species_context_columns: []
  - id: chemical_endpoint_duration
    label: Chemical + endpoint + duration
    description: Adds endpoint one-hot and exposure-duration residual while keeping species context disabled.
    model:
      context_encoder:
        use_endpoint: true
        use_duration: true
    deep_features:
      species_context_columns: []
  - id: chemical_species_context
    label: Chemical + endpoint + duration + species
    description: Adds endpoint, duration, primary medium, lifestage, and taxon context residual.
    model:
      context_encoder:
        use_endpoint: true
        use_duration: true
    deep_features:
      species_context_columns:
        - primary_medium
        - organism_lifestage
        - taxon_group_l1
        - taxon_group_l2
        - taxon_group_l3
        - is_standard_test_species
        - is_us_invasive_species
        - is_us_threatened_endangered
